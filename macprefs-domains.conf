# One preference domain per line. Blank lines and lines starting with #
# are ignored. Add or remove freely -- domains that don't exist on the
# source Mac are skipped with a note, they are not an error.
#
# Find the domain for any app with:   defaults domains | tr ',' '\n' | grep -i <name>

